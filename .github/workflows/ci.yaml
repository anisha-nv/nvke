# Phase 3 of the CI POC (branch: ci-poc-phase3-svc).
#
# Builds on the Phase 1 hello-world gate by wiring in the real Go qualification
# lane. A `check-paths` job (dorny/paths-filter) classifies the PR diff as code
# vs docs-only, then a real `tests` job (the reusable qualification.yaml running
# lint/test/build) and a `tests-skip` twin run under inverse conditions — so
# exactly one of them executes and both feed the aggregate gate. This mirrors
# NVIDIA/aicr's merge-gate.yaml idioms (permissions, concurrency, the
# check-paths real/skip-twin pattern, and the aggregate gate job) so it can grow
# into the production merge gate in place rather than being rewritten later.
#
# Phase 3 extends the reusable qualification.yaml with a `service-smoke` job (a
# `postgres:17` service container reached at 127.0.0.1:<mapped-port>, de-risking
# cloud-workflow-engine's `make e2e-gofail` lane) and an advisory, non-blocking
# `temporal-smoke` job. Both live inside qualification.yaml, so they ride the
# existing `tests` real/skip-twin wiring automatically — the aggregate gate
# still gates on the single `tests` reusable-workflow result and needs no new
# entries in its needs: list.
#
# The final "gate" job aggregates every upstream job's result into a single
# pass/fail and is intended to become the SOLE required status check in the
# main branch ruleset. To add a gating check later: add a real job plus a
# companion -skip twin with inverse if: conditions, then add both names to the
# gate job's needs: list — no ruleset change required.

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # Hello world — proves the runner + checkout work and the repo is reachable
  # ---------------------------------------------------------------------------

  hello:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Prove CI is alive and the checkout worked
        run: |
          echo "nke CI is alive on ${RUNNER_OS} / $(uname -m)"
          echo "Go toolchain pinned by .go-version:"
          cat .go-version

  # ---------------------------------------------------------------------------
  # Path classification — determines whether the qualification tests run or skip
  # ---------------------------------------------------------------------------

  check-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # pull-requests:read lets dorny/paths-filter list the PR's changed files
    # via the API. Unlike public repos (e.g. aicr), that read is not implicitly
    # available on an internal/private repo with a contents:read-only token.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.code.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # code = true iff at least one changed file is NOT docs/markdown/LICENSE.
      #
      # Exclusion idiom (copied from aicr's merge-gate.yaml): dorny's
      # `predicate-quantifier: 'every'` requires a file to match EVERY pattern in
      # the filter, so a file matches `code` only when it matches '**' AND none of
      # the docs patterns. The filter output is true when ANY changed file is
      # code — so a docs-only PR yields code=false. '**' matches dotfiles too
      # (dorny sets picomatch dot:true), so '.golangci.yaml', '.settings.yaml',
      # etc. still count as code.
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        id: code
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**.md'
              - '!docs/**'
              - '!LICENSE'

  # ---------------------------------------------------------------------------
  # Qualification (lint, test, build) — real job + skip twin. Exactly one runs.
  # ---------------------------------------------------------------------------

  tests:
    needs: [check-paths]
    if: needs.check-paths.outputs.code == 'true'
    uses: ./.github/workflows/qualification.yaml
    permissions:
      contents: read
    with:
      privileged_ci: true

  tests-skip:
    needs: [check-paths]
    if: needs.check-paths.outputs.code != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "Docs/non-code change — qualification tests not required"

  # ---------------------------------------------------------------------------
  # GHCR publish + visibility smoke (POC-only, CI POC / PR #6)
  #
  # Temporary probe jobs: publish a minimal image to ghcr.io and check the
  # package-visibility semantics of this internal-visibility repo — PR-token
  # packages:write, package auto-link on first push, and visibility inheritance.
  # Deliberately advisory: NOT wired into the gate job's needs: list, so the gate
  # signal stays clean if org policy denies the PR token's push. Delete this
  # entire section (and Dockerfile.smoke) before any graduation to main.
  # ---------------------------------------------------------------------------

  ghcr-publish:
    # head_ref only exists on pull_request events; the push-to-main trigger must
    # not run this POC job.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This grant is itself a probe. Same-repo PRs may REQUEST write scopes (fork
    # PRs never can); whether the token is actually granted packages:write is what
    # we are measuring. A 403 on push means org policy caps PR tokens to read —
    # that is a finding, not a bug.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go-version }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build the static hello binary
        run: CGO_ENABLED=0 go build -o hello ./cmd/hello

      - name: Login to GHCR
        # aicr's ghcr-login pattern (see NVIDIA/aicr
        # .github/actions/ghcr-login/action.yml).
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the smoke image
        env:
          # Pass the untrusted head_ref through the environment (actionlint
          # script-injection mitigation) instead of interpolating it inline.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          TAG="$(echo "${HEAD_REF}" | tr '/' '-')"
          # Lowercase org namespace (aicr convention: ghcr.io/nvidia/... even
          # though the org is NVIDIA).
          IMAGE="ghcr.io/nvidia/nke/ci-smoke:${TAG}"
          # The org.opencontainers.image.source label is what auto-links the
          # package to this repo on first push — that link is what drives the
          # package's visibility/permission inheritance from the repo.
          docker build -f Dockerfile.smoke \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "${IMAGE}" .
          docker push "${IMAGE}"
          docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}" || true
          echo "pushed=${IMAGE}"

  ghcr-verify-pull:
    needs: [ghcr-publish]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull the smoke image with a read-only grant
        # Proves an authenticated Actions-side pull works with packages:read on a
        # fresh runner.
        env:
          # Same actionlint script-injection mitigation as ghcr-publish.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          TAG="$(echo "${HEAD_REF}" | tr '/' '-')"
          docker pull "ghcr.io/nvidia/nke/ci-smoke:${TAG}"

  ghcr-inspect:
    needs: [ghcr-publish]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Whether GITHUB_TOKEN may read the org packages API is itself a probe — a
    # 403 here is a finding, not a bug — so this job never fails the run.
    continue-on-error: true
    permissions:
      packages: read
    steps:
      - name: Inspect the package via the org packages API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "orgs/NVIDIA/packages/container/nke%2Fci-smoke" \
            --jq '{name, visibility, repo: .repository.full_name, url: .html_url}' || echo "::warning::org packages API not readable with GITHUB_TOKEN (probe result)"
          gh api "orgs/NVIDIA/packages/container/nke%2Fci-smoke/versions?per_page=10" \
            --jq '.[] | {id, tags: .metadata.container.tags}' || true

  # ---------------------------------------------------------------------------
  # Aggregate gate — the single required status check
  #
  # Intended to become the SOLE required status check in the main branch
  # ruleset once this POC graduates. Every gating check is added to its needs:
  # list and this job aggregates all results into one pass/fail. Phase 3 gates
  # on the hello job, path classification, and the qualification real/skip twin
  # — where the real `tests` call now also carries the postgres service-smoke
  # job (blocking) and the advisory temporal-smoke job (non-blocking, via
  # continue-on-error in qualification.yaml), with no change to this needs: list.
  # ---------------------------------------------------------------------------

  gate:
    if: always()
    needs: [hello, check-paths, tests, tests-skip]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check gate
        run: |
          echo "Gate results:"
          echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "\(.key): \(.value.result)"'

          # check-paths must succeed — if it fails, the downstream tests /
          # tests-skip jobs are skipped (not failed), which would silently pass
          # the gate. Fail closed on a check-paths that did not succeed.
          if [ "${{ needs.check-paths.result }}" != "success" ]; then
            echo "::error::check-paths did not succeed (result: ${{ needs.check-paths.result }})"
            exit 1
          fi

          # Fail if ANY dependency failed or was cancelled.
          # Skipped is OK — it means an inverse/conditional job ran instead.
          if echo '${{ toJSON(needs.*.result) }}' | jq -e 'map(select(. == "failure" or . == "cancelled")) | length > 0' > /dev/null; then
            echo "::error::One or more gating checks failed or were cancelled"
            exit 1
          fi
