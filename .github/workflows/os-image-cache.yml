name: OS Image Cache

# Keeps two things os-image-artifact.yml's bake reads from in the S3 build
# cache, so a bake pulls from S3 instead of paying for them itself:
#
#   - the Ubuntu installer ISOs (four, 2 to 3 GiB each -- too big for the
#     10 GiB GitHub cache)
#   - the "installed disk" -- the qcow2, efivars.fd and SSH keypair
#     nke-node-{fde,non-fde}-install.pkr.hcl produce, which the provision
#     stage boots as a thin overlay. This is the expensive half of a bake
#     (autoinstall, ~12-15 min of each ~25-32 min build); caching it, not
#     just the ISO, is the actual point of this workflow's "installed-disk"
#     job below.
#
# The bake only reads. Its runs are on pull-request/N branches and tags, which
# the cache's write role does not trust: that role trusts only refs/heads/main,
# so this workflow on main is the only writer. The ISO side keys on its own
# filename (the Ubuntu point release and the arch); the installed-disk side
# keys on print-installed-disk-cache-key.sh's sha256, which changes whenever
# anything that shapes the install stage does -- see that script and
# UBUNTU_SNAPSHOT in the packer Makefile.
#
# Nothing here is trusted on the way back out: prepare-installer-iso.sh checks
# a restored ISO against Ubuntu's SHA256SUMS, as it does a fresh download, and
# the provision build's own iso_checksum rechecks a restored installed disk
# against the digest recorded in its material manifest (see
# add-installed-disk-material.sh).
on:
  push:
    branches: [main]
    paths:
      - os-image/packer/Makefile
      - os-image/packer/cidata/**
      - os-image/packer/locals.pkr.hcl
      - os-image/packer/variables.pkr.hcl
      - os-image/packer/versions.pkr.hcl
      - os-image/packer/nke-node-*-install.pkr.hcl
      - os-image/packer/scripts/print-installed-disk-cache-key.sh
      - os-image/packer/scripts/prepare-installer-iso.sh
      - .github/workflows/os-image-cache.yml
  # The bucket expires objects 30 days after they are written. The ISO side
  # rewrites anything two weeks old on this weekly run, well inside expiry;
  # the installed-disk side uses the same 14-day freshness check.
  schedule:
    - cron: '40 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: OS Image Cache
  cancel-in-progress: false

env:
  # Keep in step with os-image-artifact.yml.
  BUILD_CACHE_BUCKET: dgxc-eks-gha-cache-2a09007c
  BUILD_CACHE_REGION: us-east-1
  BUILD_CACHE_WRITE_ROLE: arn:aws:iam::920052440457:role/NkeGhaCacheWriteRole
  BUILD_CACHE_ISO_PREFIX: nke/os-image/iso
  BUILD_CACHE_INSTALLED_PREFIX: nke/os-image/installed

jobs:
  iso:
    if: github.repository == 'dsx-ai-factory/nke'
    name: Cache the installer ISO (${{ matrix.arch }}, ubuntu ${{ matrix.ubuntu_release }})
    runs-on: ubuntu-latest
    # arm64's ISO comes from cdimage.ubuntu.com at a couple of MB/s.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        # Keep in step with the matrix job in os-image-artifact.yml.
        ubuntu_release: [26.04.1, 24.04.5]
    permissions:
      contents: read
      id-token: write  # the build cache's write role
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials for the build cache
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.BUILD_CACHE_WRITE_ROLE }}
          aws-region: ${{ env.BUILD_CACHE_REGION }}

      - name: Download, verify and upload
        env:
          BUCKET: ${{ env.BUILD_CACHE_BUCKET }}
          ARCH: ${{ matrix.arch }}
          UBUNTU_RELEASE: ${{ matrix.ubuntu_release }}
        run: |
          set -euo pipefail
          resolve() {
            make --no-print-directory -C os-image/packer "print-$1" \
              ARCH="${ARCH}" UBUNTU_RELEASE="${UBUNTU_RELEASE}"
          }
          iso_url="$(resolve ISO_URL)"
          sums_url="$(resolve ISO_CHECKSUM)"
          sums_url="${sums_url#file:}"
          name="${iso_url##*/}"
          key="${BUILD_CACHE_ISO_PREFIX}/${name}"

          # Empty on a miss. The write role may not list the bucket, which
          # turns a miss into a 403, so no status is read from this.
          written="$(aws s3api head-object --bucket "${BUCKET}" --key "${key}" \
            --query LastModified --output text 2>/dev/null || true)"
          if [[ -n "${written}" ]] &&
            (( $(date +%s) - $(date -d "${written}" +%s) < 14 * 86400 )); then
            echo "s3://${BUCKET}/${key} was written ${written}; nothing to do"
            exit 0
          fi

          want="$(curl -fsSL "${sums_url}" | awk -v n="${name}" '$2 == n || $2 == "*" n { print $1 }')"
          if [[ -z "${want}" ]]; then
            echo "::error::no checksum for ${name} in ${sums_url}"
            exit 1
          fi
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 -o "${name}" "${iso_url}"
          echo "${want}  ${name}" | sha256sum -c -
          aws s3 cp "${name}" "s3://${BUCKET}/${key}" --only-show-errors
          echo "::notice::cached ${iso_url} as s3://${BUCKET}/${key}"

  # Populates the installed-disk half of the cache described above. Unlike
  # the ISO job, this actually runs the install stage (autoinstall), so it
  # needs the same KVM runners and toolchain as os-image-artifact.yml's bake
  # -- see that workflow's "Enable KVM access" and QEMU/Packer install steps,
  # mirrored here.
  installed-disk:
    if: github.repository == 'dsx-ai-factory/nke'
    name: Cache the installed disk (${{ matrix.arch }}, ubuntu ${{ matrix.ubuntu_release }}, ${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        # Keep in step with the matrix job in os-image-artifact.yml.
        ubuntu_release: [26.04.1, 24.04.5]
        variant: [fde, non-fde]
        include:
          - arch: amd64
            runner: arc-amd64-kvm
          - arch: arm64
            runner: arc-arm64-kvm
    runs-on: ${{ matrix.runner }}
    # The install stage alone runs in minutes under real KVM (see the packer
    # Makefile's SSH_TIMEOUT comment); this leaves real headroom for tool
    # setup and a slow runner without approaching the bake's own 180m.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write  # the build cache's write role
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install make
        run: |
          command -v make >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq make
          }

      - name: Read pinned tool versions
        id: versions
        run: |
          {
            echo "packer_version=$(make --no-print-directory print-PACKER_VERSION)"
            echo "packer_sha256_amd64=$(make --no-print-directory print-PACKER_SHA256_AMD64)"
            echo "packer_sha256_arm64=$(make --no-print-directory print-PACKER_SHA256_ARM64)"
            echo "s5cmd_version=$(make --no-print-directory print-S5CMD_VERSION)"
            echo "s5cmd_sha256_amd64=$(make --no-print-directory print-S5CMD_SHA256_AMD64)"
            echo "s5cmd_sha256_arm64=$(make --no-print-directory print-S5CMD_SHA256_ARM64)"
          } >> "$GITHUB_OUTPUT"

      # Narrower than os-image-artifact.yml's identically named step: the
      # install stage alone needs no cloud-localds/genisoimage (demo-fde.sh
      # and the boot-smoke tools only) and no dpkg-dev (fetch-artifacts.sh's
      # CNI deb indexing, which the install stage never runs -- see C1).
      # zstd compresses the upload; the bake installs it too, so both sides
      # pick the same <key>.tar.zst object name.
      - name: Install QEMU, swtpm, OVMF/AAVMF, unzip, 7z, xorriso, and zstd
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-system-arm qemu-utils unzip swtpm ovmf qemu-efi-aarch64 p7zip-full xorriso zstd

      # Same as os-image-artifact.yml's "Enable KVM access": the install
      # stage needs real KVM, not tcg fallback.
      - name: Enable KVM access
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::This runner did not expose /dev/kvm (${{ matrix.arch }} leg)"
            exit 1
          fi
          if [[ -d /run/udev ]] && command -v udevadm >/dev/null; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --settle --name-match=kvm
          else
            sudo chmod 666 /dev/kvm
          fi
          exec 3<>/dev/kvm
          exec 3>&-

      - name: Install Packer
        env:
          PACKER_VERSION: ${{ steps.versions.outputs.packer_version }}
          PACKER_SHA256: ${{ steps.versions.outputs.packer_sha256_amd64 }}
          PACKER_SHA256_ARM64: ${{ steps.versions.outputs.packer_sha256_arm64 }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          expected="${PACKER_SHA256}"
          [[ "${ARCH}" == "arm64" ]] && expected="${PACKER_SHA256_ARM64}"
          zip="packer_${PACKER_VERSION}_linux_${ARCH}.zip"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/${zip}" \
            "https://releases.hashicorp.com/packer/${PACKER_VERSION}/${zip}"
          actual="$(sha256sum "${tmp}/${zip}" | awk '{print $1}')"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::checksum mismatch for ${zip}: got ${actual}, expected ${expected}"
            exit 1
          fi
          unzip -d "${tmp}" "${tmp}/${zip}" packer
          sudo install -m 0755 "${tmp}/packer" /usr/local/bin/packer
          packer version

      - name: Install s5cmd
        env:
          S5CMD_VERSION: ${{ steps.versions.outputs.s5cmd_version }}
          S5CMD_SHA256: ${{ steps.versions.outputs.s5cmd_sha256_amd64 }}
          S5CMD_SHA256_ARM64: ${{ steps.versions.outputs.s5cmd_sha256_arm64 }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          expected="${S5CMD_SHA256}"
          platform=64bit
          if [[ "${ARCH}" == "arm64" ]]; then
            expected="${S5CMD_SHA256_ARM64}"
            platform=arm64
          fi
          tarball="s5cmd_${S5CMD_VERSION}_Linux-${platform}.tar.gz"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/${tarball}" \
            "https://github.com/peak/s5cmd/releases/download/v${S5CMD_VERSION}/${tarball}"
          echo "${expected}  ${tmp}/${tarball}" | sha256sum -c -
          tar -xzf "${tmp}/${tarball}" -C "${tmp}" s5cmd
          sudo install -m 0755 "${tmp}/s5cmd" /usr/local/bin/s5cmd
          s5cmd version

      - name: Configure AWS credentials for the build cache
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.BUILD_CACHE_WRITE_ROLE }}
          aws-region: ${{ env.BUILD_CACHE_REGION }}

      # One object per key: a tar, zstd-compressed where the runner has
      # zstd. Both this step and the bake's restore decide the extension the
      # same way (command -v zstd), independently but consistently, since
      # both run on the same ARC KVM runner images.
      - name: Compute the installed-disk cache key and object name
        id: key
        env:
          ARCH: ${{ matrix.arch }}
          UBUNTU_RELEASE: ${{ matrix.ubuntu_release }}
        run: |
          set -euo pipefail
          key_var="INSTALLED_DISK_CACHE_KEY_$(printf '%s' "${{ matrix.variant }}" | tr 'a-z-' 'A-Z_')"
          key="$(make --no-print-directory -C os-image/packer "print-${key_var}" \
            ARCH="${ARCH}" UBUNTU_RELEASE="${UBUNTU_RELEASE}")"
          ext=tar
          command -v zstd >/dev/null 2>&1 && ext=tar.zst
          {
            echo "key=${key}"
            echo "object=${BUILD_CACHE_INSTALLED_PREFIX}/${key}.${ext}"
          } >> "$GITHUB_OUTPUT"

      # The KVM runners have no aws CLI, only the s5cmd already installed
      # above. s5cmd ls prints "<date> <time> <size> <key>"; anything under
      # 14 days old needs nothing. The read role gates on the exact key, not
      # ListBucket, so this resolves the same single key the restore side
      # (and the refresh/build/upload steps below) use.
      - name: Check whether the cache entry is fresh
        id: freshness
        env:
          OBJECT: ${{ steps.key.outputs.object }}
        run: |
          set -euo pipefail
          line="$(s5cmd ls "s3://${BUILD_CACHE_BUCKET}/${OBJECT}" 2>/dev/null | tail -n1 || true)"
          if [[ -z "${line}" ]]; then
            echo "mode=miss" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          written="$(awk '{print $1, $2}' <<<"${line}" | tr '/' '-')"
          if (( $(date +%s) - $(date -d "${written}" +%s) < 14 * 86400 )); then
            echo "s3://${BUILD_CACHE_BUCKET}/${OBJECT} was written ${written}; nothing to do"
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
          else
            echo "mode=stale" >> "$GITHUB_OUTPUT"
          fi

      # The snapshot pin (UBUNTU_SNAPSHOT) makes an aging entry exactly as
      # valid as a fresh rebuild would be, so an aging-but-present entry
      # gets its S3 clock reset with a copy, not a rebuild. Same-key copies
      # are not valid S3 requests without a metadata change, so this goes
      # through a temp key instead.
      - name: Refresh an aging entry without rebuilding
        if: steps.freshness.outputs.mode == 'stale'
        env:
          OBJECT: ${{ steps.key.outputs.object }}
        run: |
          set -euo pipefail
          object="s3://${BUILD_CACHE_BUCKET}/${OBJECT}"
          tmp="${object}.refresh"
          s5cmd cp "${object}" "${tmp}"
          s5cmd cp "${tmp}" "${object}"
          s5cmd rm "${tmp}"
          echo "::notice::refreshed ${object}"

      # Runs the install stage only (see the packer Makefile's
      # prepare-installed-disk-fde/non-fde), never the provision stage: the
      # provision stage's nke content (nke-agent, SPIRE, CNI) is built and
      # verified by the bake itself, not cached here.
      - name: Build the installed disk
        if: steps.freshness.outputs.mode == 'miss'
        env:
          ARCH: ${{ matrix.arch }}
          UBUNTU_RELEASE: ${{ matrix.ubuntu_release }}
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          make -C os-image/packer "prepare-installed-disk-${{ matrix.variant }}" \
            ARCH="${ARCH}" ACCELERATOR=kvm UBUNTU_RELEASE="${UBUNTU_RELEASE}"

      - name: Upload to the build cache
        if: steps.freshness.outputs.mode == 'miss'
        env:
          KEY: ${{ steps.key.outputs.key }}
          OBJECT: ${{ steps.key.outputs.object }}
        run: |
          set -euo pipefail
          src="os-image/packer/installed-cache/${KEY}"
          for f in nke-node-installed.qcow2 efivars.fd id_ed25519 id_ed25519.pub; do
            [[ -f "${src}/${f}" ]] || { echo "::error::missing ${src}/${f}" >&2; exit 1; }
          done
          archive="$(mktemp)"
          if [[ "${OBJECT}" == *.tar.zst ]]; then
            tar -cf - -C "${src}" . | zstd -c > "${archive}"
          else
            tar -cf "${archive}" -C "${src}" .
          fi
          s5cmd cp "${archive}" "s3://${BUILD_CACHE_BUCKET}/${OBJECT}"
          rm -f "${archive}"
          echo "::notice::cached installed disk for ${{ matrix.arch }}/${{ matrix.ubuntu_release }}/${{ matrix.variant }} as s3://${BUILD_CACHE_BUCKET}/${OBJECT}"
