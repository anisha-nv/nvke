#
# Checks that the tenant GPU runtime deploy path is installable and
# self-contained.
#
# controller/deploy/tenant-runtime is installed into a tenant cluster by the
# Forge qualification lane, which runs by hand and rarely. Without this, a
# change that breaks it -- an unpinned chart version, a namespace that no item
# creates, a node selector nothing in an NKE cluster satisfies -- is found
# forty minutes into a run on real hardware, or not until the next one.
#
# It also holds the line on where that content may come from. The installer
# reads a directory and cannot tell who wrote it, which is what lets the
# runtime later be generated by whoever owns it upstream. This is the check
# that makes such a change reviewable on the same terms as a hand-written one:
# public registries only, no internal-only references, nothing that depends on
# labels an NKE cluster does not apply.
#
# Offline. The same script takes --online, which resolves and renders each
# chart against its upstream repository, and the Forge lane runs it that way.
# Every pull request does not, because a pull request should not go red when
# a chart repository is briefly unreachable.
#
# Runs on ubuntu-latest and installs nothing: the script needs bash, git, grep
# and python3, so there is no version to pin.
#
# Deliberately NOT path-filtered, for the reason recorded in actionlint.yml: a
# filtered check does not report on a pull request that misses the filter, and
# a required check that never reports leaves that pull request waiting forever.
# See .github/workflows/README.md.

name: Deploy Path Check

# All pull requests, including forks and Dependabot, reach this through
# merge-gate.yml. The standalone push trigger is post-merge coverage on main.
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch: {}

permissions: {}

concurrency:
  # The sha is part of the group on main, so every commit gets its own. See the
  # longer note in shellcheck.yml for why, and why this is a literal name rather
  # than ${{ github.workflow }}.
  group: Deploy Path Check-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deploy-path-check:
    name: deploy-path-check
    runs-on: ubuntu-latest
    if: github.repository == 'dsx-ai-factory/nke'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tenant runtime deploy path
        run: make --no-print-directory deploy-path-check
