#
# Fills the placeholders in qualify/plan.json from the same SITE_E2E_*
# repository variables forge-site-controller-e2e.yml itself falls back to,
# flattens each combination/stream pair into the shape that workflow's
# stream-json input takes, fans the result out as a GitHub Actions matrix,
# then dispatches forge-site-controller-e2e.yml once per stream and waits
# for each to finish.
#
# qualify/plan.json is hand-authored for now. Replacing it with the output of
# a real `qualify plan` resolver is a change to what produces that file, not
# to this workflow -- the plan job below only cares that it has plan.json's
# shape (subject/version/scope/combinations[], each combination carrying
# components[], dependencies[] and streams[], each stream carrying
# capabilities and its own dependencies[]) with placeholders already
# substitutable from the environment.
#
# This is the scheduled, unattended counterpart to qualify/run-matrix.sh,
# which does the identical substitution and flattening but is meant to be
# run by hand. The two are kept in lockstep; a change to one should be
# mirrored in the other until there is a single place both read from.
#
# Needs a GitHub App installed on this repo, Actions: Read and write and
# nothing else, with its ID and private key stored as the QUALIFY_APP_ID and
# QUALIFY_APP_PRIVATE_KEY secrets. The default GITHUB_TOKEN cannot trigger
# workflow_dispatch on another workflow in the same repo -- GitHub blocks
# that specifically to prevent one workflow's automatic token from chaining
# into another run. Nothing here works until that App exists and is
# installed; ask whoever owns the dsx-ai-factory GitHub org to set it up.
name: Qualify

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  plan:
    name: Resolve the qualification matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fill placeholders in plan.json from repository variables
        id: resolve
        shell: bash
        env:
          QUALIFY_VERSION: ${{ vars.QUALIFY_VERSION }}
          QUALIFY_KIND_VERSION: ${{ vars.QUALIFY_KIND_VERSION }}
          QUALIFY_CLUSTERCTL_VERSION: ${{ vars.QUALIFY_CLUSTERCTL_VERSION }}
          QUALIFY_NERDCTL_VERSION: ${{ vars.QUALIFY_NERDCTL_VERSION }}
          SITE_E2E_CONTROLLER_VERSION: ${{ vars.SITE_E2E_CONTROLLER_VERSION }}
          SITE_E2E_CLI_VERSION: ${{ vars.SITE_E2E_CLI_VERSION }}
          SITE_E2E_OS_IMAGE_VERSION: ${{ vars.SITE_E2E_OS_IMAGE_VERSION }}
          SITE_E2E_CAPI_PROVISIONED_VERSION: ${{ vars.SITE_E2E_CAPI_PROVISIONED_VERSION }}
          SITE_E2E_CNI_OVN_VERSION: ${{ vars.SITE_E2E_CNI_OVN_VERSION }}
          SITE_E2E_KUBERNETES_VERSION: ${{ vars.SITE_E2E_KUBERNETES_VERSION }}
          SITE_E2E_OS_IMAGE_ARM64: ${{ vars.SITE_E2E_OS_IMAGE_ARM64 }}
          SITE_E2E_OS_IMAGE_BOOTLOADER_ARM64: ${{ vars.SITE_E2E_OS_IMAGE_BOOTLOADER_ARM64 }}
          SITE_E2E_OS_IMAGE_AMD64: ${{ vars.SITE_E2E_OS_IMAGE_AMD64 }}
          SITE_E2E_OS_IMAGE_BOOTLOADER_AMD64: ${{ vars.SITE_E2E_OS_IMAGE_BOOTLOADER_AMD64 }}
        run: |
          set -Eeuo pipefail
          resolved="$(envsubst < qualify/plan.json)"

          # Each stream becomes one flat object: its own capabilities, the
          # component versions from the combination it belongs to, and --
          # from its own os-image dependency's artifacts -- just the one
          # image and bootloader URL matching its own arch. This is the
          # exact shape forge-site-controller-e2e.yml's stream-json input
          # takes, so the qualify job below can pass a matrix entry straight
          # through with no further reshaping.
          matrix="$(jq -c '
            [
              .combinations[] as $c |
              $c.streams[] as $s |
              ($s.capabilities.arch) as $arch |
              ($s.dependencies[] | select(.name=="os-image") | .artifacts) as $artifacts |
              (reduce ($artifacts[] | select(.arch==$arch)) as $a
                 ({}; . + {($a.name + "-" + $a.arch): $a.url})
              ) as $images |
              ({
                name: $s.name,
                arch: $arch,
                gpu: ($s.capabilities.gpu // ""),
                "kubernetes-version": (($s.dependencies[] | select(.name=="kube") | .version) // ""),
                "controller-version": (($c.components[] | select(.name=="controller") | .version) // ""),
                "cli-version": (($c.components[] | select(.name=="cli") | .version) // ""),
                "capi-provisioned-version": (($c.components[] | select(.name=="capi-provisioned") | .version) // ""),
                "cni-ovn-version": (($c.dependencies[] | select(.name=="nke-cni-ovn") | .version) // "")
              } + $images)
            ]
          ' <<<"${resolved}")"

          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "::notice::resolved $(jq 'length' <<<"${matrix}") streams"
          jq . <<<"${matrix}"

  qualify:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Mint a short-lived App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.QUALIFY_APP_ID }}
          private-key: ${{ secrets.QUALIFY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: nke

      - name: Dispatch forge-site-controller-e2e.yml for this stream
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STREAM_JSON: ${{ toJson(matrix) }}
        run: |
          set -Eeuo pipefail

          # workflow_dispatch returns nothing identifying the run it
          # created, so the run is found the same way a person would: the
          # newest workflow_dispatch run against this workflow after the
          # moment this dispatched. A concurrent manual dispatch of the same
          # workflow in this window would be misattributed; accepted for
          # now since this job is the only thing expected to dispatch it on
          # a schedule.
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run forge-site-controller-e2e.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f stage=full \
            -f "stream-json=${STREAM_JSON}"
          sleep 15
          run_id="$(gh run list --repo "${{ github.repository }}" --workflow forge-site-controller-e2e.yml \
            --json databaseId,event,createdAt \
            --jq "[.[] | select(.event==\"workflow_dispatch\" and .createdAt>=\"${before}\")] | sort_by(.createdAt) | first | .databaseId")"
          if [ -z "${run_id}" ] || [ "${run_id}" = "null" ]; then
            echo "::error::could not find the dispatched run for ${{ matrix.name }}"
            exit 1
          fi
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "::notice::dispatched run ${run_id} for ${{ matrix.name }}"

      - name: Wait for it to finish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -Eeuo pipefail
          gh run watch "${{ steps.dispatch.outputs.run_id }}" --exit-status --repo "${{ github.repository }}"
