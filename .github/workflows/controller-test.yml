#
# Unit-test lane for the controller modules. Until this existed, agent-test.yml
# was the only workflow that ran `go test` anywhere in the repository, so
# controller/, controller/forge-vms/, controller/hack/nico-mock/, and nkectl
# were
# compiled, linted, vetted, CodeQL-scanned and govulncheck-scanned -- and never
# tested. A test suite nothing runs reads as coverage in review and provides
# none.
#
# Not covered by the test job, deliberately: controller/api and
# controller/hack/capd-reboot-controller have no _test.go files at all, and
# controller/test/e2e needs a live cluster in KUBECONFIG -- `make test-e2e`
# drives it, and it does not belong in a pull-request lane.
#
# The `compile` job below covers those heavier suites in the one way a pull
# request can: it type-checks them without running them. See its own comment.
#
# ⚠️ CGO_ENABLED=1 is set deliberately and this lane does not work without it.
# #116 replaced modernc.org/sqlite (pure Go) with mattn/go-sqlite3 (a cgo
# binding). Without cgo that package compiles to a stub that fails at the FIRST
# QUERY rather than at build time, so 8 controller packages fail with
# "requires cgo to work. This is a stub". A cross-compile disables cgo by
# default too -- not only an explicit CGO_ENABLED=0 -- so this must stay
# explicit rather than rely on a default.
#
# GitHub-hosted runners, not the self-hosted linux-*-cpu16 pool, for the reason
# in agent-test.yml: self-hosted runners do not receive pull_request events, so
# using them would cost coverage of fork and Dependabot pull requests.
# ubuntu-latest ships a C toolchain, which is what cgo needs.

name: Controller Unit Tests

# Pull requests and main pushes reach this workflow through merge-gate.yml.
# The caller supplies only the unit-test modules and compile-only suites related
# to the changed paths.
on:
  workflow_call:
    inputs:
      unit_modules:
        description: JSON array of module directories with unit tests
        required: false
        type: string
        default: '["cli","controller","controller/forge-vms","controller/hack/nico-mock"]'
      compile_suites:
        description: JSON array of compile-only suite identifiers
        required: false
        type: string
        default: '["e2e-gofail","teleport-integration","integration-test","forge-vms-integration","test-e2e"]'
  workflow_dispatch:
    inputs:
      unit_modules:
        description: JSON array of module directories with unit tests
        required: false
        type: string
        default: '["cli","controller","controller/forge-vms","controller/hack/nico-mock"]'
      compile_suites:
        description: JSON array of compile-only suite identifiers
        required: false
        type: string
        default: '["e2e-gofail","teleport-integration","integration-test","forge-vms-integration","test-e2e"]'

permissions: {}

concurrency:
  # The sha is part of the group on main, so every commit gets its own.
  # Without it, back-to-back merges lose CI results: GitHub allows one
  # running and one pending run per group, and cancels the pending one
  # when a third arrives -- whatever cancel-in-progress says, because that
  # setting only protects a run that has already started. Five merges in
  # three minutes cancelled 18 runs across 7 workflows this way, leaving
  # three consecutive commits on main with no test result at all.
  #
  # Pull-request branches keep sharing a group and still cancel, which is
  # what you want there.
  # A literal name, NOT ${{ github.workflow }}. Inside a called workflow that
  # expression is the CALLER's name, so every workflow merge-gate.yml calls would
  # compute the same group and cancel each other -- 8 of 9 calls died that way,
  # reported to the gate as failures with no jobs and no error message.
  group: Controller Unit Tests-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # Do not cancel a run on main; the newer workflows here all guard this.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Unit tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    if: github.repository == 'NVIDIA/nke' && inputs.unit_modules != '[]'
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(inputs.unit_modules) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Workspace mode (default) so tests resolve from the committed vendor/
      # tree. go.work carries the toolchain that satisfies every module.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      # -race, the follow-up this step used to defer. It is what caught the
      # regression in #116, and the reason for waiting -- not wanting a first
      # red run to conflate two changes -- expired once the lane was green.
      #
      # Measured before enabling: the full controller suite passes with 0 data
      # races, and the added time is tens of seconds against the 30-minute
      # timeout above. CGO_ENABLED=1 was already required here and the race
      # detector needs cgo too, so nothing else changes.
      - name: Run unit tests
        working-directory: ${{ matrix.module }}
        env:
          CGO_ENABLED: "1"
          GO_TEST_FLAGS: -race
        run: make test

  # Type-checks the test code that nothing in CI compiles. These suites need a
  # cluster, a live API, real VMs or a fault-injection build, so a pull request
  # cannot run them -- but it can prove they still build, which is the failure
  # they actually suffer from: they are written against packages that keep
  # moving, and they rot silently.
  #
  # `go build ./...` does not cover this. It ignores _test.go entirely, and
  # ignores any file behind a build tag nothing sets. So:
  #
  #   - controller/test/e2e is a separate module of 21 test files and no
  #     non-test package. Nothing compiles it. Worse, controller-test.yml
  #     filters on `paths: controller/**`, which MATCHES controller/test/e2e/**
  #     -- so editing an e2e spec triggers a green "Controller Unit Tests" run
  #     that never read the edited file.
  #   - controller/e2e/... is behind `-tags gofail`; `go list ./e2e/...`
  #     reports "matched no packages" without it.
  #   - the teleport and forge-vms integration suites are behind
  #     `-tags integration`. No workflow anywhere sets a Go build tag.
  #   - controller/integration-test is dropped from `make test` by a grep,
  #     because it needs a CWE on port 8080.
  #
  # go vet rather than `go build`: it type-checks test files, which is the
  # point, and it is the cheapest thing that does. All five are green today.
  compile:
    name: Compile (${{ matrix.suite }})
    runs-on: ubuntu-latest
    if: github.repository == 'NVIDIA/nke' && inputs.compile_suites != '[]'
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.compile_suites) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      # Same reason as the test job: these packages reach mattn/go-sqlite3,
      # which needs cgo.
      - name: Type-check
        env:
          CGO_ENABLED: "1"
          SUITE: ${{ matrix.suite }}
        run: |
          case "${SUITE}" in
            test-e2e)
              go -C controller/test/e2e vet ./...
              ;;
            e2e-gofail)
              go -C controller vet -tags gofail ./e2e/...
              ;;
            teleport-integration)
              go -C controller vet -tags integration ./internal/teleport/...
              ;;
            forge-vms-integration)
              go -C controller/forge-vms vet -tags integration ./test/integration/...
              ;;
            integration-test)
              go -C controller vet ./integration-test/...
              ;;
            *)
              echo "::error::unknown compile suite: ${SUITE}"
              exit 1
              ;;
          esac
