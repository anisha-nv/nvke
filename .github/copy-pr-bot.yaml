# Contributors whose pull requests the bot mirrors without a vetter's
# `/ok to test`. A mirrored run is a `push` on a branch inside this repository,
# so it carries full repo context and reaches the self-hosted runners -- every
# entry here is an account that can execute code on them with no per-pull-request
# human review. Keep the list minimal.
#
# Eligibility: a current member of the dsx-ai-factory organization who also holds
# write, maintain or admin on this repository. Anyone else needs a maintainer's
# `/ok to test <SHA>`, which is granted per-commit.
#
# This list does not maintain itself -- leavers and access changes are not
# reflected until someone prunes it. To list entries that no longer qualify:
#
#   comm -23 \
#     <(sed -n 's/^  - //p' .github/copy-pr-bot.yaml | sort) \
#     <(comm -12 \
#       <(gh api --paginate "orgs/dsx-ai-factory/members?per_page=100" \
#           --jq '.[].login' | sort) \
#       <(gh api --paginate "repos/dsx-ai-factory/nvke/collaborators?per_page=100" \
#           --jq '.[] | select(.role_name=="write" or .role_name=="maintain"
#                 or .role_name=="admin") | .login' | sort))
#
# Eligibility is necessary, not sufficient: being eligible does not mean an
# account belongs here, so prune from this list rather than regenerating it.
#
# Last pruned 2026-10-14.
