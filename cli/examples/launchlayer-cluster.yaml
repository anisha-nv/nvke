# Illustrative intent, not allocated resources. Requires launchlayer admission.
name: ll-typed-example
controlPlaneKubernetesVersion: "1.35.0"
cniPlugin: calico
etcdEncrypted: false
launchlayer:
  vpcID: example-vpc
  siteID: ""
  cloudProviderEnabled: false
  owner:
    userID: example-user
    username: example-operator
nodePools:
  - name: cp
    nodeNamePrefix: cp
    controlPlane: true
    desiredNodeCount: 1
    launchlayer:
      machine:
        instanceType: example-control-plane
        hostOSProfile: example-host:1
        fulfillmentStrategy: BEST_EFFORT
  - name: workers
    nodeNamePrefix: worker
    controlPlane: false
    desiredNodeCount: 2
    launchlayer:
      machine:
        instanceType: example-worker
        hostOSProfile: example-host:1
        vmProfile: example-vm:1
        fulfillmentStrategy: WAIT_FOR_RESOURCE
        securityGroups:
          primaryNetworkInterface: [example-primary]
          gpuNetworkInterface: []
      bootstrapFiles:
        - path: /etc/example.conf
          content: example-content
      preKubeadmCommands: [echo example-command]
