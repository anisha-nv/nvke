# temporal values for the capnico-e2e deploy path. The item is its own helm release
# (see release.yaml), so these values sit at the chart's top level.

# ─── temporal ────────────────────────────────────────────────────────────────
# Owns the release namespace (see the header). The persistence host below is an
# FQDN into postgresql's namespace, so it stays correct across the split.
# Pin the service names with fullnameOverride so
# temporal-frontend.temporal.svc.cluster.local, the host cloud-workflow-engine
# dials, does not depend on the release name. controller/Tiltfile and
# release.yaml both install this chart as release "temporal".
fullnameOverride: temporal
server:
  configMapsToMount: sprig
  setConfigFilePath: true
  config:
    persistence:
      driver: sql
      default:
        driver: sql
        sql:
          driver: postgres12
          host: postgres-postgresql.postgres.svc.cluster.local
          port: 5432
          database: temporal
          user: postgres
          maxConns: 10
          maxIdleConns: 5
      visibility:
        driver: sql
        sql:
          driver: postgres12
          host: postgres-postgresql.postgres.svc.cluster.local
          port: 5432
          database: temporal_visibility
          user: postgres
          maxConns: 10
          maxIdleConns: 5
cassandra:
  enabled: false
mysql:
  enabled: false
# temporal bundles its own postgresql; the composition supplies one instead.
postgresql:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false
elasticsearch:
  enabled: false
schema:
  createDatabase:
    enabled: true
  setup:
    enabled: true
  update:
    enabled: true
